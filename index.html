<script>
// Neteja d'urgència: si en aquest domini hi va quedar instal·lada l'app de
// l'Espartà, el seu service worker segueix servint-la des de la memòria del
// navegador i tapa la consola. Es treu sol, una sola vegada per pestanya.
(function(){
  if (!('serviceWorker' in navigator)) return;
  var propi = new URL('./sw.js', location.href).href;
  navigator.serviceWorker.getRegistrations().then(function(regs){
    var fora = regs.filter(function(r){
      var s = (r.active || r.installing || r.waiting || {}).scriptURL || '';
      return s && s !== propi;
    });
    if (!fora.length) return;
    if (sessionStorage.getItem('esparta-netejat')) return;
    sessionStorage.setItem('esparta-netejat', '1');
    Promise.all(fora.map(function(r){ return r.unregister(); }))
      .then(function(){
        return (window.caches && caches.keys) ? caches.keys().then(function(k){
          return Promise.all(k.map(function(n){ return caches.delete(n); }));
        }) : null;
      })
      .then(function(){ location.reload(); });
  }).catch(function(){});
})();
</script>
